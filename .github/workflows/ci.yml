name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv lock
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: >-
          uv run --frozen --extra dev --python "${{ matrix.python-version }}"
          python -m compileall -q src scripts
      - run: >-
          uv run --frozen --extra dev --python "${{ matrix.python-version }}"
          python -m ruff check . --output-format=github
      - run: >-
          uv run --frozen --extra dev --python "${{ matrix.python-version }}"
          python -m coverage run -m pytest -q
      - run: >-
          uv run --frozen --extra dev --python "${{ matrix.python-version }}"
          python -m coverage report
      - run: >-
          uv run --frozen --extra dev --python "${{ matrix.python-version }}"
          python scripts/validate_repository.py

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: ea_core
          POSTGRES_USER: ea_app
          POSTGRES_PASSWORD: ea_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ea_app -d ea_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Apply foundation migrations
        env:
          PGPASSWORD: ea_test_password
        run: |
          set -euo pipefail
          for migration_path in database/migrations/*.sql; do
            psql --host 127.0.0.1 --username ea_app --dbname ea_core \
              --set ON_ERROR_STOP=1 --file "$migration_path"
          done
      - name: Verify required tables
        env:
          PGPASSWORD: ea_test_password
        run: |
          table_count="$(
            psql --host 127.0.0.1 --username ea_app --dbname ea_core \
              --tuples-only --no-align \
              --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'architecture_core';"
          )"
          test "$table_count" -eq 19
      - name: Exercise tenant, temporal, identity, and outbox invariants
        env:
          PGPASSWORD: ea_test_password
        run: >-
          psql --host 127.0.0.1 --username ea_app --dbname ea_core
          --set ON_ERROR_STOP=1 --file database/tests/verify_foundation.sql

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv lock
      - run: uv sync --frozen --extra dev --python 3.13
      - run: uv build --wheel --sdist --out-dir dist
      - run: uv venv .package-smoke --python 3.13
      - run: >-
          uv pip install --python .package-smoke/bin/python
          --no-index --find-links dist enterprise-architecture-foundation
      - name: Smoke-test installed package
        run: |
          .package-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.util import find_spec

          import ea_core_foundation

          assert version("enterprise-architecture-foundation") == "0.1.0"
          assert ea_core_foundation.__version__ == "0.1.0"
          assert find_spec("jsonschema") is None
          PY
