name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Validate exact source
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: bash .github/scripts/ci.sh validate

  postgres-migration:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_DB: ea_core
          POSTGRES_USER: ea_app
          POSTGRES_PASSWORD: ea_test_password
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ea_app -d ea_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exercise migration acceptance gates
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: ea_app
          PGPASSWORD: ea_test_password
          PGDATABASE: ea_core
        run: bash .github/scripts/ci.sh postgres-migration

  compose-runtime:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exercise isolated database runtime role
        env:
          EA_OWNER_PASSWORD: ea_owner_test_password
          EA_RUNTIME_PASSWORD: ea_runtime_test_password
        run: bash .github/scripts/ci.sh compose-runtime

  package:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Build and smoke-test isolated package
        env:
          PYTHON_VERSION: "3.14"
        run: bash .github/scripts/ci.sh package
      - name: Capture dependency lock for exact source commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
      - name: Capture reviewed distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_DIST }}
          if-no-files-found: error
          retention-days: 1
