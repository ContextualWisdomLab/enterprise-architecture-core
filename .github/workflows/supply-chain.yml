name: supply-chain

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle_snapshot: ${{ steps.package-snapshot.outputs.bundle_snapshot }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv lock --check
      - run: uv build --wheel --sdist --out-dir dist
      - name: Generate SPDX 3 JSON SBOM from built distributions
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json@3.0
          output-file: dist/enterprise-architecture-core.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.51.0
      - name: Validate SPDX 3.0.1 SBOM and artifact checksums
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          primary_sbom = json.loads(
              Path("dist/enterprise-architecture-core.spdx.json")
              .read_text(encoding="utf-8")
          )
          assert primary_sbom.get("@context") == (
              "https://spdx.org/rdf/3.0.1/spdx-context.jsonld"
          )
          graph = primary_sbom.get("@graph")
          assert isinstance(graph, list) and graph
          assert any(
              item.get("type") == "CreationInfo"
              and item.get("specVersion") == "3.0.1"
              for item in graph
              if isinstance(item, dict)
          )
          assert any(
              item.get("type") == "software_Package"
              for item in graph
              if isinstance(item, dict)
          )
          assert any(Path("dist").glob("*.whl"))
          assert any(Path("dist").glob("*.tar.gz"))
          PY
          (
            cd dist
            sha256sum -- *.whl *.tar.gz \
              enterprise-architecture-core.spdx.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Assemble canonical package evidence
        run: |
          rm -rf package-evidence
          install -d -m 0700 package-evidence
          cp -- dist/*.whl dist/*.tar.gz \
            dist/enterprise-architecture-core.spdx.json \
            dist/SHA256SUMS package-evidence/
      - name: Verify generated package evidence
        run: python scripts/verify_package_evidence_bundle.py package-evidence
      - name: Capture producer package snapshot
        id: package-snapshot
        run: |
          bundle_snapshot="$(sha256sum package-evidence/SHA256SUMS | awk '{print $1}')"
          echo "bundle_snapshot=${bundle_snapshot}" >> "$GITHUB_OUTPUT"
      - name: Upload checked-out commit package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ github.sha }}
          path: |
            package-evidence/*.whl
            package-evidence/*.tar.gz
            package-evidence/enterprise-architecture-core.spdx.json
            package-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest-protected-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Download exact-head package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-evidence-${{ github.sha }}
          path: evidence
      - name: Verify downloaded package evidence before attestation
        run: python scripts/verify_package_evidence_bundle.py evidence
      - name: Require exact producer package snapshot
        env:
          EXPECTED_PACKAGE_SNAPSHOT: ${{ needs.package-evidence.outputs.bundle_snapshot }}
        run: |
          observed_package_snapshot="$(sha256sum evidence/SHA256SUMS | awk '{print $1}')"
          test "$observed_package_snapshot" = "$EXPECTED_PACKAGE_SNAPSHOT"
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            evidence/*.whl
            evidence/*.tar.gz
      - name: Attest SPDX 3 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            evidence/*.whl
            evidence/*.tar.gz
          predicate-type: https://spdx.dev/Document/v3
          predicate-path: evidence/enterprise-architecture-core.spdx.json
      - name: Verify protected-main provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_REF: refs/heads/main
          REPOSITORY: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/supply-chain.yml
          SPDX_PREDICATE: https://spdx.dev/Document/v3
          EVIDENCE_DIR: evidence
          VERIFICATION_DIR: attestation-verification
        run: bash scripts/verify_release_attestations.sh
      - name: Retain protected-main attestation verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-verification-${{ github.sha }}
          path: attestation-verification/*.json
          if-no-files-found: error
          retention-days: 90
