name: supply-chain

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-evidence:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Build fresh installed-package evidence
        run: bash .github/scripts/ci.sh package
      - name: Generate SPDX 3 JSON SBOM from built distributions
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.CI_DIST }}
          format: spdx-json@3.0
          output-file: ${{ env.CI_DIST }}/enterprise-architecture-core.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.51.0
      - name: Validate SPDX 3.0.1 SBOM and artifact checksums
        env:
          CI_DIST: ${{ env.CI_DIST }}
        run: bash .github/scripts/validate-sbom.sh "$CI_DIST"
      - name: Upload exact source package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.CI_DIST }}/*.whl
            ${{ env.CI_DIST }}/*.tar.gz
            ${{ env.CI_DIST }}/enterprise-architecture-core.spdx.json
            ${{ env.CI_DIST }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest-protected-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: package-evidence
    runs-on: [self-hosted, linux, x64, ea-core-release-ci]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Initialize private downloaded evidence
        run: bash .github/scripts/prepare-evidence.sh
      - name: Download exact-head package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-evidence-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE }}
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.CI_EVIDENCE }}/*.whl
            ${{ env.CI_EVIDENCE }}/*.tar.gz
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.CI_EVIDENCE }}/*.whl
            ${{ env.CI_EVIDENCE }}/*.tar.gz
          predicate-type: https://spdx.dev/Document/v3
          predicate-path: ${{ env.CI_EVIDENCE }}/enterprise-architecture-core.spdx.json
