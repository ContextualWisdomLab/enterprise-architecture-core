name: runtime-readiness

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-process-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Start documented PostgreSQL profile
        env:
          EA_OWNER_PASSWORD: ea_owner_test_password
          EA_RUNTIME_PASSWORD: ea_runtime_test_password
        run: docker compose up --detach --wait
      - name: Prepare runtime fixture
        env:
          PGPASSWORD: ea_owner_test_password
        run: >-
          psql --host 127.0.0.1 --port 54328 --username ea_owner --dbname ea_core
          --set ON_ERROR_STOP=1
          --file database/acceptance/runtime/prepare_runtime_fixture.sql
      - name: Build and install the reviewed wheel
        run: |
          uv lock --check
          uv sync --locked --extra dev --python 3.14
          uv build --wheel --out-dir dist
          uv venv .runtime-smoke --python 3.14
          uv pip install --python .runtime-smoke/bin/python \
            --no-index --find-links dist enterprise-architecture-core
      - name: Prove healthy database and absent immutable contract fail closed independently
        env:
          EA_BIND_HOST: 127.0.0.1
          PORT: "18080"
          EA_DATABASE_DSN: postgresql://ea_runtime:ea_runtime_test_password@127.0.0.1:54328/ea_core
        run: |
          set -euo pipefail
          .runtime-smoke/bin/ea-core >runtime.log 2>&1 &
          service_pid="$!"
          cleanup() {
            kill "$service_pid" 2>/dev/null || true
            wait "$service_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health >/dev/null; then
              echo "health endpoint ready after ${attempt} attempt(s)"
              break
            fi
            sleep 1
          done
          .runtime-smoke/bin/python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen

          try:
              urlopen("http://127.0.0.1:18080/ready", timeout=2)
          except HTTPError as error:
              assert error.code == 503
              payload = json.loads(error.read())
          else:
              raise AssertionError("unreleased Context Graph dependency passed readiness")
          assert payload["database_ready"] is True, payload
          assert payload["contract_ready"] is False, payload
          PY
      - name: Prove broken database configuration reports the database dimension
        env:
          EA_BIND_HOST: 127.0.0.1
          PORT: "18081"
          EA_DATABASE_DSN: postgresql://ea_runtime:wrong-test-password@127.0.0.1:54328/ea_core
        run: |
          set -euo pipefail
          .runtime-smoke/bin/ea-core >runtime-bad-db.log 2>&1 &
          service_pid="$!"
          cleanup() {
            kill "$service_pid" 2>/dev/null || true
            wait "$service_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18081/health >/dev/null; then
              echo "health endpoint ready after ${attempt} attempt(s)"
              break
            fi
            sleep 1
          done
          .runtime-smoke/bin/python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen

          try:
              urlopen("http://127.0.0.1:18081/ready", timeout=2)
          except HTTPError as error:
              assert error.code == 503
              payload = json.loads(error.read())
          else:
              raise AssertionError("broken database unexpectedly passed readiness")
          assert payload["database_ready"] is False, payload
          assert payload["contract_ready"] is False, payload
          PY
      - name: Stop documented PostgreSQL profile
        if: always()
        env:
          EA_OWNER_PASSWORD: ea_owner_test_password
          EA_RUNTIME_PASSWORD: ea_runtime_test_password
        run: docker compose down --volumes --remove-orphans
