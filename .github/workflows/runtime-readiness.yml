name: runtime-readiness

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-process-readiness:
    runs-on: [self-hosted, linux, x64, ea-core-ci]
    timeout-minutes: 10
    steps:
      - name: Admit trusted source
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Exercise isolated installed-process readiness
        env:
          PYTHON_VERSION: "3.14"
          EA_OWNER_PASSWORD: ea_owner_test_password
          EA_RUNTIME_PASSWORD: ea_runtime_test_password
        run: bash .github/scripts/ci.sh runtime-readiness
